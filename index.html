<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<base href="./analytical_interface/" />
<title>Scientific Analysis Hub · Violence against women</title>
<meta name="description" content="Interactive exploration of a structured dataset of 580 articles on global research on violence against women: topics, megatopics, study countries and research flows, with downloadable selections." />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/open-dyslexic@1.0.3/open-dyslexic-regular.css" />
<link rel="stylesheet" href="styles.css" />
<script src="https://cdn.plot.ly/plotly-geo-2.35.2.min.js" integrity="sha384-DmJKZWkm1LpUBdTdXGaLyycadGEvbnP2mDJsDNioDQw1uAWC6HVD/8rjaZqeF6X2" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="js/i18n.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="js/shell.jsx"></script>
<script type="text/babel" src="js/charts.jsx"></script>
<script type="text/babel" src="js/pages-1.jsx"></script>
<script type="text/babel" src="js/pages-2.jsx"></script>
<script type="text/babel" src="js/app.jsx"></script>
<script type="text/babel" src="js/palette.jsx"></script>

<script type="text/babel">
const { useState: useS, useEffect: useE, useRef: useR, useMemo: useM, useCallback: useC } = React;

const SETTINGS_STORAGE_KEY = "hubSettingsV3";
const prefersDark = () => {
  try { return window.matchMedia("(prefers-color-scheme: dark)").matches; } catch (_) { return false; }
};
const DEFAULT_SETTINGS = {
  theme: prefersDark() ? "dark" : "light",
  fontScale: 1,
  dyslexicFontEnabled: false,
  vlibrasEnabled: false,
  language: "auto",
  onboardingSeen: false,
};

function readSettings() {
  try {
    localStorage.removeItem("hubSettingsLogV1");
    const parsed = JSON.parse(localStorage.getItem(SETTINGS_STORAGE_KEY) || "{}");
    return { ...DEFAULT_SETTINGS, ...(parsed && typeof parsed === "object" ? parsed : {}) };
  } catch (_) {
    return { ...DEFAULT_SETTINGS };
  }
}

function saveSettings(settings) {
  try { localStorage.setItem(SETTINGS_STORAGE_KEY, JSON.stringify(settings)); } catch (_) { /* storage unavailable */ }
}

function ensureVlibrasLoaded() {
  if (window.__vlibrasReadyPromise) return window.__vlibrasReadyPromise;

  window.__vlibrasReadyPromise = new Promise((resolve, reject) => {
    const done = () => {
      if (window.VLibras && window.VLibras.Widget) {
        resolve(window.VLibras);
        return true;
      }
      return false;
    };

    if (done()) return;

    let attempts = 0;
    const poll = window.setInterval(() => {
      attempts += 1;
      if (done()) window.clearInterval(poll);
      else if (attempts >= 50) {
        window.clearInterval(poll);
        reject(new Error("VLibras unavailable"));
      }
    }, 200);

    if (!document.getElementById("vlibras-script")) {
      const script = document.createElement("script");
      script.id = "vlibras-script";
      script.src = "https://vlibras.gov.br/app/vlibras-plugin.js";
      script.async = true;
      script.onerror = () => reject(new Error("VLibras script load failed"));
      document.body.appendChild(script);
    }
  });

  return window.__vlibrasReadyPromise;
}

function Onboarding({ meta, onClose }) {
  const startRef = useR(null);
  useE(() => { startRef.current && startRef.current.focus(); }, []);
  const md5 = meta?.source_hash?.articles_dataset_csv_md5 || "";
  return (
    <div className="onboard-overlay" onClick={onClose}>
      <div className="onboard-card" role="dialog" aria-modal="true" aria-labelledby="onboard-title" onClick={(e) => e.stopPropagation()}>
        <div className="onboard-side">
          <span className="vol">{meta ? `${meta.version} · ${meta.date}` : ""}</span>
          <div className="title">{t("app.name")} {t("app.nameSub")}</div>
          <div className="stamp">
            <strong>{t("onboard.corpus")}</strong><br/>
            {t("onboard.articles", { n: fmtInt(meta?.n_articles || 0) })}<br/>
            {t("onboard.topics", { n: meta?.n_topics || 0 })}<br/>
            {t("onboard.megatopics", { n: meta?.n_megatopics || 0 })}<br/>
            {md5 && <><br/><strong>{t("onboard.integrity")}</strong><br/>md5 {md5.slice(0, 8)}…</>}
          </div>
        </div>
        <div className="onboard-body">
          <span className="onboard-kicker">{t("onboard.kicker")}</span>
          <h2 id="onboard-title" style={{ marginTop: 8 }}>{t("onboard.title")}</h2>
          <p>{t("onboard.body")}</p>
          <ol className="onboard-steps">
            {["s1", "s2", "s3", "s4"].map((k, i) => (
              <li key={k} className="onboard-step">
                <span className="num">§ 0{i + 1}</span>
                <span className="lbl">{t("onboard." + k, { key: "Ctrl/⌘ K" })}</span>
              </li>
            ))}
          </ol>
          <div className="onboard-actions">
            <button ref={startRef} type="button" className="btn-ed primary" onClick={onClose}>{t("onboard.start")}</button>
            <span className="onboard-skip">{t("onboard.skip")}</span>
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [settings, setSettings] = useS(readSettings);
  const updateSettings = (patch) => setSettings((s) => ({ ...s, ...patch }));
  // Resolve the language before rendering so every t() call below uses it.
  const lang = useM(() => I18N.setLang(settings.language), [settings.language]);
  const [palette, setPalette] = useS(false);
  const [toast, setToast] = useS("");
  const notify = useC((msg) => setToast(msg), []);
  const clearToast = useC(() => setToast(""), []);
  const cmdRef = useR(null);
  const meta = useRes("data/meta.json");
  const topics = useDatasetRes("topics");
  const megatopics = useDatasetRes("megatopics");

  useE(() => { saveSettings(settings); }, [settings]);

  useE(() => {
    const root = document.documentElement;
    root.setAttribute("data-theme", settings.theme);
    root.setAttribute("data-font-family", settings.dyslexicFontEnabled ? "dyslexic" : "default");
    root.style.setProperty("--font-scale", String(settings.fontScale || 1));
  }, [settings.theme, settings.dyslexicFontEnabled, settings.fontScale]);

  useE(() => {
    const root = document.getElementById("vlibras-root");
    if (!settings.vlibrasEnabled) {
      if (root) root.style.display = "none";
      return;
    }
    if (!root) {
      const el = document.createElement("div");
      el.id = "vlibras-root";
      el.innerHTML = '<div vw class="enabled"><div vw-access-button class="active"></div><div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div></div>';
      document.body.appendChild(el);
    } else {
      root.style.display = "";
    }
    ensureVlibrasLoaded()
      .then(() => {
        if (!window.__vlibrasWidget) window.__vlibrasWidget = new window.VLibras.Widget("https://vlibras.gov.br/app");
      })
      .catch(() => notify(t("settings.vlibrasError")));
  }, [settings.vlibrasEnabled]);

  const closeOnboarding = () => updateSettings({ onboardingSeen: true });
  const send = (cmd) => cmdRef.current && cmdRef.current(cmd);

  useE(() => {
    const onKey = (e) => {
      const tag = (e.target?.tagName || "").toLowerCase();
      const inField = tag === "input" || tag === "select" || tag === "textarea" || e.target?.isContentEditable;
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); setPalette(true); return; }
      if (e.key === "Escape") { setPalette(false); return; }
      if (inField || e.metaKey || e.ctrlKey || e.altKey) return;
      const levels = { "1": "home", "2": "macro", "3": "meso", "4": "micro" };
      if (levels[e.key]) send({ type: "level", level: levels[e.key] });
      else if (e.key.toLowerCase() === "r") { send({ type: "reset" }); notify(t("toast.reset")); }
      else if (e.key.toLowerCase() === "c") send({ type: "toggle-geo" });
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  useE(() => {
    if (settings.onboardingSeen) return undefined;
    const onKey = (e) => { if (e.key === "Escape") closeOnboarding(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [settings.onboardingSeen]);

  const handleAction = (cmd) => {
    send(cmd);
    if (cmd.type === "filter") notify(t("toast.filter"));
    if (cmd.type === "level") notify(t("toast.level", { level: t("level." + cmd.level) }));
    if (cmd.type === "reset") notify(t("toast.reset"));
    if (cmd.type === "drill-mega") notify(t("toast.mega"));
    if (cmd.type === "drill-topic") notify(t("toast.topic"));
  };

  return (
    <>
      <HubApp
        commandRef={cmdRef}
        settings={settings}
        onSettingsChange={updateSettings}
        onShowTour={() => updateSettings({ onboardingSeen: false })}
        notify={notify}
        lang={lang}
      />

      {!settings.onboardingSeen && <Onboarding meta={meta.data} onClose={closeOnboarding} />}

      <CommandPalette open={palette} onClose={() => setPalette(false)}
                      onAction={handleAction}
                      megatopics={megatopics.data || []} topics={topics.data || []} />

      <Toast msg={toast} onDone={clearToast} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
